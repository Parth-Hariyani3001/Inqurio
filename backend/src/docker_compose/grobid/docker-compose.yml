version: "3.9"

services:
  grobid:
    image: grobid/grobid:0.9.0
    container_name: grobid

    ports:
      - "8070:8070"
      - "8071:8071"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s